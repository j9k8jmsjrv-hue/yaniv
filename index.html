const RULES="スタート画面でCPU戦かルーム戦を選び、ダイヤルを上下にスワイプして人数(2〜15)と試合数(1〜30)と持ち時間を決める。試合数ぶん続けて対戦し、勝ち数で総合順位を決める(同数は合計点が低い方が上)。ルーム戦は足りない席をCPUが埋める。ルーム戦で途中で抜けた人の席はCPUで埋めず、人数が減った状態で続ける(試合中なら抜けた人の手札は山札の下に入れる)。抜けた人は「途中退出」としてマイナス評価。手札5枚。ドラ表示牌の次の数字がドラ(K→A)。ドラは-2、K=-1(ドラ表示がQでドラがKのときは、K=-3)。ドラ表示がKのとき(ドラがA)は、Aの合計が偶数枚なら-5・奇数枚なら+5(Kはふつうの-1)。ジョーカーは0(ドラなら+5)。A=1、J=11、Q=12、他は数字。A〜Kの5連続(ストレート。KからAへはつながらないので J・Q・K・A・2 は不可)があるとその5枚は0点。ストレートは5枚まとめて捨てることもでき、手札を左から右へスワイプすると一括で選んで捨てられる(ストレート内の7は七渡無効)。ストレートかフラッシュで手札が0枚になったら、山札・捨て札からは引かない。ストレートなら宣言なしでヤニブと同じ扱い(すでに誰かがヤニブ宣言していたら、引かずにその人の番はおしまい)。フラッシュはそのまま一発勝ち。同じマーク4枚(数字は問わない)とジョーカー1枚の5枚を一度に捨てると「フラッシュ」で、その試合は一発で勝ち(どの番でも可・ヤニブ宣言のあとでも可。順位は宣言者より上)。捨て方はストレートと同じ(手札を左から右へなぞる)。スペシャルカード(SC): テーブル設定で「あり」のとき、ストアでGコインで買ったSCを1試合2回まで使える(のぞき見・スキップ・リバース・ガード・チェンジ・バリア・般若)。自分の番にSCボタンで一覧を開き(1回5秒・その間は持ち時間が止まる・1ターン2回まで)、ダブルタップで使う。ガード・バリアは持っていれば自動で発動し、2回使い切ったあとは1枚500Gでその場で買える(7秒)。Gコインは試合の順位でもらえる(ルーム戦5人以上: 100/50/30/10G、4人以下: 50/30/10/0G、CPU戦4人以上: 30/10G・1日150Gまで)。ヤニブ宣言者より低い数で勝ったときは、上限に関係なく100G。ルーム戦の途中退出は−50G、NEXT GAMEの時間切れは−25G、CPU戦のリタイアは−10G。自分の番に捨てる前なら何点でもヤニブ宣言可(宣言後に他の人が自分も勝てる手札ならパスで手番を飛ばせる)、ジョーカー2枚で強制ヤニブ。宣言者は手札を裏向きでテーブルに置く。同数字、または2〜10の3枚の階段を捨てられ(小さい順に置く)、その後に山札か直前の捨て札の一番上を引く。7を捨てると通常どおり1枚だけ引き(山札・捨て札どちらでも可)、7の枚数だけ次の人に手札を渡す(七渡。次の人が宣言者のときは宣言者を飛ばして渡す。最終ターンの七渡のあとゲーム終了)。七渡で手札が0枚になったら、宣言なしでヤニブ宣言と同じ扱い。延長ターン中は、自分が直前に捨てた札は引けない。延長のもとになったJ/Q/Kは、そのあと誰も捨て札から引けない(延長ターン中は、前の人が捨てたJ/Q/Kも引けない)。同数字3枚を捨てるとドラ表示牌が1枚、4枚だと2枚追加される(同数字2枚を捨てて、山札から引いた同じ数字を続けて捨てたときも3枚とみなしてドラ追加。3枚+1枚なら4枚とみなしてもう1枚追加。続けて捨てたあとはもう引かない)。宣言後は他の人が1周し、J/Q/Kを出した人は1ターン延長(1枚につき1回、何度でも)。延長はすぐ続けてではなく、J/Q/Kを捨てて1枚引いたら次の人(まだ番が残っている人)へ番が移り、そのあとで回ってくる(ほかに番が残っている人がいなければ続けて自分)。宣言後は、J/Q/Kを捨てて同じ数字のJ/Q/Kを引いても続けて捨てられない(一旦次の人へ)。最後の人の動き(七渡なら渡し終わるまで)が終わってから結果画面になる。NEXT GAMEは各自が押し、全員そろうと次の試合が始まる(先に押した人はテーブルで待つ)。ルーム戦では1分以内に押さないと退場扱い。最も点が低い人の勝ち(同点は宣言者の勝ち)。席の並びは毎局ランダムに決め直し、席の順に進行。最初の番は1局目がランダム、2局目以降は前回勝者(勝者が複数ならその中からランダム)。勝者が1人ならその人の初期手札は4枚(複数なら全員5枚)。最初に山札から1枚を中央の捨て札に置く。1周目にヤニブ宣言が出た場合は、宣言者以外の全員にもう1ターンずつ与えられる。山札から引いた札が今回捨てた数字と同じなら続けて捨てられる(引き直し不可)。ジョーカーは捨てられない(七渡で渡すことはできる)。持ち時間はCPU戦・ルーム戦とも30秒・45秒・60秒・無しから選べる(引くときは10秒。時間切れは自動で進む。無しのときは引くときも制限なし)。トランプは5人までは1セット(54枚)、6〜9人は2セット(108枚)、10人以上は3セット(162枚)使う(ジョーカーもセット数ぶん)。七渡は山札から1枚引いてから渡す札を選び、必ず実行(2枚以上渡すときは数字がちがう札を組み合わせてもいい)(ただし階段に含まれる7は七渡無効)。捨て札の7は引けない(ゲーム開始時の最初の捨て札が7の場合のみ引ける)。階段を捨てたターンは、山札から引いた札が階段と同じ数字でも続けて捨てられない。点数がマイナスになるとオーバーフローで最下位扱いになる。ただしドラにA・K・ジョーカーのどれかがある間だけはオーバーフローせず、マイナスでも勝てる。";
